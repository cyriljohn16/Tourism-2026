<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ibayaw Tour Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Poppins, Arial, sans-serif;
      color: #173357;
      background: linear-gradient(135deg, #f6f9ff, #eef4fb);
    }
    .offline-card {
      max-width: 520px;
      border: 1px solid #d7e4f2;
      border-radius: 18px;
      background: #fff;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(17, 50, 92, 0.14);
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: clamp(1.35rem, 5vw, 2rem); }
    p { margin: 0; line-height: 1.6; color: #4e6279; }
  </style>
</head>
<body>
  <main class="offline-card">
    <h1>You are offline</h1>
    <p>Please reconnect to use maps, chatbot, booking features, and the latest Bayawan tourism information.</p>
  </main>
</body>
</html>
