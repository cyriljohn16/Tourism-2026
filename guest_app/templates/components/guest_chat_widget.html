      const forceNewTab = options.newTab === true;
      const openInNewTabSafely = (targetUrl) => {
        const newWin = window.open(targetUrl, '_blank', 'noopener,noreferrer');
        if (newWin) {
          newWin.opener = null;
          return true;
        }
        try {
          const anchor = document.createElement('a');
          anchor.href = String(targetUrl || '').trim();
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          anchor.style.display = 'none';
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          return true;
        } catch (e) {
          return false;
        }
      };
      if (forceNewTab) {
        openInNewTabSafely(url);
        return;
      }
      try {
        const target = new URL(url, window.location.origin);
        if (target.origin === window.location.origin) {
          window.location.href = target.href;
          return;
        }
      } catch (e) {
        // Fall back to default behavior below.
      }
      openInNewTabSafely(url);
    }

      if (
        body.includes('tour payment')
        || body.includes('payment is handled only after')
      ) return 'tour_payment_information';
      if (
        body.includes('tour booking request')
        || body.includes('pending means your tour booking')
        || body.includes('check your tour booking status')
      ) return 'tour_booking_status';
      if (payload && (payload.map_action || payload.open_map)) return 'directions';
      if (payload && payload.billing_link) {
        const linkLabel = String(payload.billing_link_label || '').toLowerCase();
        if (
          linkLabel.includes('map')
          || linkLabel.includes('direction')
          || linkLabel.includes('location')
        ) return 'directions';
      }
      if (body.includes('direction') || body.includes('get directions') || body.includes('city map') || body.includes('current location')) return 'directions';
      if (body.includes('dining') || body.includes('restaurant') || body.includes('food') || body.includes('eat') || body.includes('mangaon') || body.includes('kaon')) return 'dining';
      if (body.includes('tourist spot') || body.includes('tourism place') || body.includes('landmark') || body.includes('places you can visit')) return 'tourism_places';
      if (body.includes('bayawan tourism') || body.includes('history') || body.includes('culture') || body.includes('festival')) return 'tourism_information';
      return '';
    }

    function resolveResponseHeading(payload, items, text) {
      const explicitTitle = String((payload && (payload.title || payload.response_title || payload.heading)) || '').trim();
      if (explicitTitle) return explicitTitle;
      const responseType = inferResponseType(payload, items, text);
      if (responseType.includes('tour_schedule')) return 'Tour Schedules';
      if (responseType.includes('tour_payment_information')) return 'Tour Payment Information';
      if (responseType.includes('tour_booking_status')) return 'Tour Booking Status';
      if (responseType.includes('tour')) return 'Tour Package Recommendations';
      if (responseType.includes('room')) return 'Available Rooms';
      if (responseType.includes('navigation_guidance')) return 'System Navigation';
      if (responseType.includes('accommodation_cost_preview') || responseType.includes('booking_preview')) return 'Accommodation Cost Preview';
      if (responseType.includes('accommodation') || responseType.includes('hotel')) return 'Accommodation Recommendations';
      if (responseType.includes('dining') || responseType.includes('food')) return 'Dining Places';
      if (responseType.includes('tourist') || responseType.includes('tourism_place') || responseType.includes('landmark') || responseType.includes('map_place')) return 'Tourism Places';
      if (responseType.includes('direction') || responseType.includes('map') || responseType.includes('current_location')) return 'Directions / Map Guidance';
      if (responseType.includes('history') || responseType.includes('culture') || responseType.includes('tourism_information') || responseType.includes('bayawan_overview')) return 'Bayawan Tourism Information';
      return '';
    }

    function appendRecommendationCards(items, opts) {
      if (!Array.isArray(items) || !items.length) return;
      const options = opts || {};
      const wrap = document.createElement('div');
      wrap.className = 'guest-chat-cards';
      const headingText = String(options.heading || '').trim();
      if (headingText) {
        const heading = document.createElement('div');
        heading.className = 'guest-chat-card-heading';
        heading.textContent = headingText;
        wrap.appendChild(heading);
      }

      items.slice(0, 5).forEach((item) => {
        if (!item || typeof item !== 'object') return;
        const kind = normalizeTraceKind(item);
        const title = String(item.title || item.accommodation_name || '').trim();
        if (!title) return;
        const subtitle = String(item.subtitle || '').trim();
        const description = String(item.description || '').trim();
        const imageUrl = String(item.profile_image_url || item.image_url || '').trim() || cardPlaceholder;
        const actions = buildCardActions(item, kind);

        const card = document.createElement('article');
        card.className = 'guest-chat-card';

        const img = document.createElement('img');
        img.className = 'guest-chat-card-image';
        img.src = imageUrl;
        img.alt = title;
        img.loading = 'lazy';
        img.onerror = function () {
          img.src = cardPlaceholder;
          img.classList.add('is-placeholder');
        };
        if (imageUrl === cardPlaceholder) img.classList.add('is-placeholder');
        card.appendChild(img);

        const body = document.createElement('div');
        body.className = 'guest-chat-card-body';

        const h = document.createElement('h4');
        h.className = 'guest-chat-card-title';
        h.textContent = title;
        body.appendChild(h);

        if (subtitle) {
          const sub = document.createElement('div');
          sub.className = 'guest-chat-card-subtitle';
          sub.textContent = subtitle;
          body.appendChild(sub);
        }
        const badges = Array.isArray(item.badges) ? item.badges : [];
        const badgeTexts = badges.concat(kind === 'accommodation' ? ['Tourism Office Approved'] : []);
        const cleanBadges = badgeTexts
          .map((badge) => String(badge || '').trim())
          .filter(Boolean)
          .filter((badge, index, arr) => arr.findIndex((value) => value.toLowerCase() === badge.toLowerCase()) === index)
          .slice(0, 3);
        if (cleanBadges.length) {
          const badgeWrap = document.createElement('div');
          badgeWrap.className = 'guest-chat-card-badges';
          cleanBadges.forEach((badgeText) => {
            const badge = document.createElement('span');
            badge.className = 'guest-chat-card-badge';
            badge.textContent = badgeText;
            badgeWrap.appendChild(badge);
          });
          body.appendChild(badgeWrap);
        }
        if (description) {
          const desc = document.createElement('div');
          desc.className = 'guest-chat-card-desc';
          desc.textContent = description.length > 160 ? `${description.slice(0, 157)}...` : description;
          body.appendChild(desc);
        }

        if (actions.length) {
          const actionWrap = document.createElement('div');
          actionWrap.className = 'guest-chat-card-actions';
          actions.forEach((a) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `guest-chat-card-btn${a.primary ? ' primary' : ''}`;
            btn.textContent = a.label;
            if (a.action === 'none' || (a.action === 'open' && !a.url) || (a.action === 'chat' && !a.value)) {
              btn.disabled = true;
              btn.setAttribute('aria-disabled', 'true');
            }
            btn.addEventListener('click', function () {
              if (a.action === 'open' && a.url) {
                const label = String(a.label || '').toLowerCase();
                if (label.includes('official') || label.includes('facebook') || label.includes('booking')) {
                  postFunnelEvent('accommodation_external_handoff_clicked', label);
                }
                openChatActionUrl(String(a.url), { newTab: a.newTab === true });
                return;
              }
              if (a.action === 'none') {
                return;
              }
              if (a.action === 'chat' && a.value) {
                const valueLower = String(a.value || '').toLowerCase();
                if (valueLower.startsWith('show rooms for ')) {
                  postFunnelEvent('accommodation_rooms_viewed', String(a.value || ''));
                } else if (valueLower.startsWith('create booking preview for ')) {
                  postFunnelEvent('accommodation_preview_started', String(a.value || ''));
                }
                sendMessage(String(a.value), true);
              }
            });
            actionWrap.appendChild(btn);
          });
          body.appendChild(actionWrap);
        }

        card.appendChild(body);
        wrap.appendChild(card);
      });

      if (!wrap.children.length) return;
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      if (options.persist !== false) {
        pushHistory({ type: 'recommendation_trace', items: items.slice(0, 5), heading: headingText });
      }
    }

    function hydrateHistory() {
      messagesEl.innerHTML = '';
      const items = readHistory();
      if (!items.length) {
        renderFreshWelcome({ persist: true });
        return;
      }
      items.forEach((entry) => {
        if (!entry || typeof entry !== 'object') return;
        if (entry.type === 'message') {
          appendMessage(String(entry.text || ''), String(entry.kind || 'bot'), { persist: false });
        } else if (entry.type === 'titled_message') {
          appendTitledBotMessage(String(entry.title || ''), String(entry.text || ''), { persist: false });
        } else if (entry.type === 'quick_replies') {
          appendQuickReplies(Array.isArray(entry.items) ? entry.items : [], { persist: false });
        } else if (entry.type === 'recommendation_trace') {
          appendRecommendationCards(Array.isArray(entry.items) ? entry.items : [], {
            persist: false,
            heading: String(entry.heading || ''),
          });
        } else if (entry.type === 'link_actions') {
          appendLinkActions(Array.isArray(entry.items) ? entry.items : [], { persist: false });
        }
      });
    }

    async function sendMessage(message, addUserBubble) {
      if (imageSendInFlight) return;
      const text = String(message || '').trim();
      if (!text) return;
      if (textSendInFlight) return;
      textSendInFlight = true;
      const lowered = text.toLowerCase();
      if (lowered.startsWith('show rooms for ')) {
        const name = text.slice('show rooms for '.length).trim();
        if (name) mergeState({ selected_accommodation_name: name });
        postFunnelEvent('accommodation_rooms_viewed', text);
      }
      if (lowered.startsWith('create booking preview for ')) {
        const ref = text.slice('create booking preview for '.length).trim();
        if (ref) mergeState({ preview_reference: ref });
        postFunnelEvent('accommodation_preview_started', text);
      }
      if (addUserBubble !== false) appendMessage(text, 'user');
      inputEl.value = '';
      sendBtn.disabled = true;
      appendMessage('Thinking...', 'bot', { persist: false });
      try {
        const response = await fetch('/api/chat/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await response.json();
        const typing = messagesEl.querySelector('.guest-chat-msg.bot:last-child');
        if (typing && typing.textContent === 'Thinking...') typing.remove();
        if (lowered === 'reset') {
          clearStoredChatData();
          renderFreshWelcome({ persist: true });
          return;
        }
        let visibleTrace = Array.isArray(data.recommendation_trace) ? data.recommendation_trace : [];
        const previewRequestRef = lowered.startsWith('create booking preview for ')
          ? text.slice('create booking preview for '.length).trim()
          : '';
        const roomsRequestRef = lowered.startsWith('show rooms for ')
          ? text.slice('show rooms for '.length).trim()
          : '';
        const normalizeAccommodationMatchText = (value) => String(value || '')
          .toLowerCase()
          .replace(/&/g, ' and ')
          .replace(/[^a-z0-9]+/g, ' ')
          .replace(/\bbayawan\b/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        const currentChatState = readState();
        const focusedAccommodationRef = String(
          data.selected_accommodation_name
          || previewRequestRef
          || roomsRequestRef
          || currentChatState.selected_accommodation_name
          || currentChatState.preview_reference
          || ''
        ).trim();
        const shouldKeepAccommodationFocus = Boolean(
          visibleTrace.length
          && focusedAccommodationRef
          && (
            previewRequestRef
            || roomsRequestRef
            || lowered.includes('booking preview')
            || lowered.includes('preview cost')
          )
        );
        if (shouldKeepAccommodationFocus) {
          const wantedName = normalizeAccommodationMatchText(
            focusedAccommodationRef
          );
          const wantedId = Number(data.selected_accommodation_id || 0);
          const filteredTrace = visibleTrace.filter((item) => {
            const itemId = Number(item && item.accom_id || 0);
            const itemName = normalizeAccommodationMatchText(
              (item && (item.accommodation_name || item.title || item.subtitle)) || ''
            );
            if (wantedId > 0 && itemId === wantedId) return true;
            return wantedName && itemName && (itemName.includes(wantedName) || wantedName.includes(itemName));
          });
          if (filteredTrace.length) {
            visibleTrace = filteredTrace;
          }
        }
        const hasCards = visibleTrace.length > 0;
        let fulfillmentText = String(data.fulfillmentText || 'No response available.').trim();
        if (shouldKeepAccommodationFocus && hasCards && visibleTrace.length < (Array.isArray(data.recommendation_trace) ? data.recommendation_trace.length : 0)) {
          const focusedName = String(visibleTrace[0].accommodation_name || visibleTrace[0].title || previewRequestRef).trim();
          fulfillmentText = roomsRequestRef
            ? `I will keep this focused on ${focusedName}.`
            : `I found ${focusedName}. I will keep this booking preview focused on that accommodation only.`;
        }
        const firstTrace = hasCards ? (visibleTrace[0] || {}) : {};
        const firstKind = hasCards ? normalizeTraceKind(firstTrace) : '';
        const looksLikeNumberedList = /(^|\n)\s*1\./.test(fulfillmentText);
        const isPreviewSummary = /estimated (accommodation )?booking preview|estimated total|accommodation:\s|room:\s|stay:\s/i.test(fulfillmentText);
        const shouldUseCardOnlyIntro = hasCards && looksLikeNumberedList && !isPreviewSummary;
        const responseHeading = resolveResponseHeading(data, hasCards ? visibleTrace : [], fulfillmentText);
        if (shouldUseCardOnlyIntro) {
          const intro = firstKind === 'room'
            ? 'Here are the available rooms.'
            : (firstKind === 'tour_schedule'
              ? 'Here are available tour schedules.'
              : (firstKind === 'tour'
                ? 'I found these available tour packages you can check.'
                : ((firstKind === 'dining')
                  ? 'Here are dining places you can explore.'
                  : ((firstKind === 'tourism_place' || firstKind === 'map_place')
                    ? 'Here are tourism places you can explore.'
                    : 'I found approved accommodations that match your request.'))))
          appendMessage(intro, 'bot');
        } else {
          const shouldUseTitledMessage = responseHeading
            && !hasCards
            && !/^no response available\.$/i.test(fulfillmentText || '');
          if (shouldUseTitledMessage) {
            appendTitledBotMessage(responseHeading, fulfillmentText || 'No response available.');
          } else {
            appendMessage(fulfillmentText || 'No response available.', 'bot');
          }
        }
        if (hasCards) {
          appendRecommendationCards(visibleTrace, { heading: responseHeading });
          if (firstKind === 'room') {
            appendMessage(
              'Next step: choose a room and tap Preview Cost, or use one of the buttons below. This creates a cost preview only; final accommodation booking is completed through the provider.',
              'bot'
            );
            const roomPreviewReplies = buildRoomPreviewQuickReplies(visibleTrace);
            if (roomPreviewReplies.length) {
              appendQuickReplies(roomPreviewReplies, { shuffle: false });
            }
          }
          const first = firstTrace || {};
          const selectedAccommodationName = String(first.accommodation_name || '').trim() || String((first.title || '').split(' - ')[0] || '').trim();
          const selectedRoomName = String((first.title || '').includes(' - ') ? (String(first.title || '').split(' - ').slice(1).join(' - ').trim()) : '').trim();
          mergeState({
            selected_accommodation_id: Number(first.accom_id || 0) || undefined,
            selected_accommodation_name: selectedAccommodationName || undefined,
            selected_room_id: Number(first.room_id || 0) || undefined,
            selected_room_name: selectedRoomName || undefined,
          });
        }
        if (data && typeof data === 'object') {
          const nextPatch = {};
          if (data.selected_accommodation_id) nextPatch.selected_accommodation_id = data.selected_accommodation_id;
          if (data.selected_accommodation_name) nextPatch.selected_accommodation_name = data.selected_accommodation_name;
          if (data.selected_room_id) nextPatch.selected_room_id = data.selected_room_id;
          if (data.selected_room_name) nextPatch.selected_room_name = data.selected_room_name;
          if (Object.keys(nextPatch).length) mergeState(nextPatch);
        }
        const mergedLinkActions = Array.isArray(data.link_actions)
          ? data.link_actions.filter((entry) => entry && entry.url)
          : [];
        if (!mergedLinkActions.length && String(data.billing_link || '').trim()) {
          mergedLinkActions.push({
            label: String(data.billing_link_label || 'Open Link').trim(),
            url: String(data.billing_link).trim(),
          });
        }
        const hasLinkActions = mergedLinkActions.length > 0;
        if (!hasCards && Array.isArray(data.quick_replies) && data.quick_replies.length) {
          const filteredReplies = hasLinkActions
            ? data.quick_replies.filter((item) => {
                const label = typeof item === 'object' ? String(item.label || item.value || '').trim().toLowerCase() : String(item || '').trim().toLowerCase();
                const value = typeof item === 'object' ? String(item.value || item.label || '').trim().toLowerCase() : String(item || '').trim().toLowerCase();
                return !['open provider page', 'contact accommodation provider', 'open official facebook page', 'open facebook page'].includes(label)
                  && !['open provider page', 'contact accommodation provider', 'open official facebook page', 'open facebook page'].includes(value);
              })
            : data.quick_replies;
          appendQuickReplies(filteredReplies);
        }
        if (!hasCards && hasLinkActions) {
          appendLinkActions(mergedLinkActions);
        }
      } catch (error) {
        const typing = messagesEl.querySelector('.guest-chat-msg.bot:last-child');
        if (typing && typing.textContent === 'Thinking...') typing.remove();
        appendMessage('I could not connect right now. Please try again.', 'bot');
      } finally {
        textSendInFlight = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    async function sendImageMessage(file, caption) {
      if (!file || imageSendInFlight) return;
      imageSendInFlight = true;
      const safeCaption = String(caption || '').trim();
      appendImageUserMessage(file, safeCaption);
      inputEl.value = '';
      sendBtn.disabled = true;
      pendingSendBtn.disabled = true;
      pendingRemoveBtn.disabled = true;
      appendAssistantLoadingMessage(safeCaption ? 'Analyzing your image and request...' : 'Analyzing your image...');
      try {
        const formData = new FormData();
        formData.append('image', file);
        if (safeCaption) {
          formData.append('message', safeCaption);
          formData.append('query', safeCaption);
        }
        const response = await fetch('/api/chat/image/', {
          method: 'POST',
          body: formData,
        });
        const data = await response.json();
        const typing = messagesEl.querySelector('.guest-chat-loading-msg:last-child');
        if (typing) typing.remove();
        const imageHasCards = Array.isArray(data.recommendation_trace) && data.recommendation_trace.length > 0;
        const imageText = String(data.fulfillmentText || 'No response available.').trim();
        const imageHeading = resolveResponseHeading(data, imageHasCards ? data.recommendation_trace : [], imageText)
          || String(data.heading || 'Image-Assisted Tourism Recommendations').trim();
        if (imageHasCards) {
          appendTitledBotMessage('Image-Assisted Tourism Recommendations', imageText);
          appendRecommendationCards(data.recommendation_trace, { heading: imageHeading });
        } else if (imageHeading) {
          appendTitledBotMessage(imageHeading, imageText);
        } else {
          appendMessage(imageText, 'bot');
        }
        if (Array.isArray(data.quick_replies) && data.quick_replies.length) {
          appendQuickReplies(data.quick_replies);
        }
        const links = Array.isArray(data.link_actions) ? data.link_actions.filter((entry) => entry && entry.url) : [];
        if (links.length) appendLinkActions(links);
      } catch (error) {
        const typing = messagesEl.querySelector('.guest-chat-loading-msg:last-child');
        if (typing) typing.remove();
        appendMessage('I could not process that image right now. Please try again.', 'bot');
      } finally {
        imageSendInFlight = false;
        sendBtn.disabled = false;
        pendingSendBtn.disabled = false;
        pendingRemoveBtn.disabled = false;
        imageInputEl.value = '';
        fileMetaEl.textContent = '';
        inputEl.value = '';
        inputEl.focus();
      }
    }

    function extractPastedImageFile(event) {
      const clipboard = event && event.clipboardData;
      if (!clipboard || !clipboard.items || !clipboard.items.length) return null;
      for (const item of clipboard.items) {
        if (!item || item.kind !== 'file') continue;
        const mime = String(item.type || '').toLowerCase();
        if (!mime.startsWith('image/')) continue;
        const file = item.getAsFile ? item.getAsFile() : null;
        if (!file) continue;
        const ext = (() => {
          const name = String(file.name || '').trim();
          if (name.includes('.')) return name.slice(name.lastIndexOf('.')).toLowerCase();
          if (mime === 'image/jpeg') return '.jpg';
          if (mime === 'image/png') return '.png';
          if (mime === 'image/webp') return '.webp';
          return '';
        })();
        if (!['.jpg', '.jpeg', '.png', '.webp'].includes(ext)) {
          return { invalidType: true, file };
        }
        const normalizedName = String(file.name || '').trim() || `pasted-image${ext}`;
        const pastedFile = new File([file], normalizedName, { type: file.type || mime || 'image/png' });
        return { file: pastedFile };
      }
      return null;
    }

    fab.addEventListener('click', function () {
      modal.classList.add('open');
      if (!messagesEl.dataset.hydrated) {
        hydrateHistory();
        messagesEl.dataset.hydrated = '1';
      }
      inputEl.focus();
    });

    closeBtn.addEventListener('click', function () {
      modal.classList.remove('open');
    });

    clearBtn.addEventListener('click', function () {
      clearStoredChatData();
      messagesEl.dataset.hydrated = '';
      renderFreshWelcome({ persist: true });
      messagesEl.dataset.hydrated = '1';
    });

    function submitGuestChatInput() {
      if (imageSendInFlight || textSendInFlight) return;
      if (pendingImageFile) {
        const fileToSend = pendingImageFile;
        const caption = inputEl.value;
        clearPendingImagePreview();
        sendImageMessage(fileToSend, caption);
        return;
      }
      sendMessage(inputEl.value, true);
    }

    sendBtn.addEventListener('click', submitGuestChatInput);
    attachBtn.addEventListener('click', function () {
      imageInputEl.click();
    });
    imageInputEl.addEventListener('change', function () {
      const file = imageInputEl.files && imageInputEl.files[0] ? imageInputEl.files[0] : null;
      if (!file) {
        fileMetaEl.textContent = '';
        return;
      }
      queueImageFile(file);
    });

    function handleImagePaste(event) {
      if (event.defaultPrevented) return;
      const pasted = extractPastedImageFile(event);
      if (!pasted) return;
      event.preventDefault();
      event.stopPropagation();
      if (pasted.invalidType) {
        appendMessage('Unsupported image type. Please upload JPG, JPEG, PNG, or WEBP.', 'bot');
        return;
      }
      const file = pasted.file;
      if (!file) return;
      queueImageFile(file);
    }

    inputEl.addEventListener('paste', handleImagePaste);
    modal.addEventListener('paste', handleImagePaste);
    pendingSendBtn.addEventListener('click', function () {
      if (!pendingImageFile || imageSendInFlight || textSendInFlight) return;
      const fileToSend = pendingImageFile;
      const caption = inputEl.value;
      clearPendingImagePreview();
      sendImageMessage(fileToSend, caption);
    });
    pendingRemoveBtn.addEventListener('click', function () {
      clearPendingImagePreview();
    });

    inputEl.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        event.stopPropagation();
        if (event.isComposing || event.repeat) return;
        submitGuestChatInput();
      }
    });

    window.IbayawGuestChat = {
      open: function () {
        modal.classList.add('open');
        if (!messagesEl.dataset.hydrated) {
          hydrateHistory();
          messagesEl.dataset.hydrated = '1';
        }
        inputEl.focus();
      },
      openAndSend: function (query) {
        const text = String(query || '').trim();
        this.open();
        if (!text) return;
        sendMessage(text, true);
      },
      startNewChat: function () {
        clearStoredChatData();
        messagesEl.dataset.hydrated = '1';
        renderFreshWelcome({ persist: true });
      },
      prefill: function (query) {
        this.open();
        inputEl.value = String(query || '').trim();
      },
    };

    document.querySelectorAll('.open-chat-query').forEach((el) => {
      el.addEventListener('click', function (event) {
        event.preventDefault();
        const query = String(el.getAttribute('data-query') || '').trim();
        if (query) {
          window.IbayawGuestChat.openAndSend(query);
        } else {
          window.IbayawGuestChat.open();
        }
      });
    });
    ensureStorageVersion();
  })();
</script>
