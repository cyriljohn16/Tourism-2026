<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: "Poppins", "Segoe UI", Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at 85% -10%, rgba(177, 116, 63, 0.18), transparent 32%),
                radial-gradient(circle at -5% 35%, rgba(111, 78, 55, 0.14), transparent 26%),
                #f8f5f1;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: linear-gradient(180deg, #fffefc 0%, #fff9f2 100%);
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #ead9c9;
            box-shadow: 0 12px 24px rgba(56, 33, 16, 0.12);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #3f2f26;
            margin-bottom: 25px;
        }
        .error {
            background-color: #ffebee;
            color: #d32f2f;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #decab7;
            border-radius: 8px;
        }
        button {
            background: linear-gradient(135deg, #875a34, #b77744);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #6d4827, #a96f3f);
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(122, 79, 45, 0.22);
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
        }
        a {
            color: #875a34;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
  <link rel="stylesheet" href="/static/css/guest_unified.css">
</head>
<body class="guest-auth">

    <div class="login-container">
        <h2>Login</h2>

        <!-- Display error messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <!-- Login Form -->
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <!-- Hidden field to preserve the 'next' parameter -->
            <input type="hidden" name="next" value="{{ request.GET.next }}">

            <!-- Username Field -->
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <!-- Password Field -->
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <!-- Submit Button -->
            <button type="submit">Login</button>
        </form>

        <!-- Register Link -->
        <div class="register-link">
            Don't have an account? <a href="{% url 'register' %}">Register here</a>.
        </div>
    </div>

</body>
</html>
