<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Booking Operations Deprecated</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
    .wrap { max-width: 760px; margin: 40px auto; background: #fff; border: 1px solid #dbe3ef; border-radius: 12px; padding: 20px; }
    .note { background: #fff7ed; border: 1px solid #fdba74; color: #9a3412; border-radius: 10px; padding: 12px; }
    .actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
    a { text-decoration: none; border-radius: 8px; padding: 8px 12px; font-weight: 700; }
    .primary { background: #1d4ed8; color: #fff; }
    .secondary { background: #475569; color: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Owner Booking Operations Deprecated</h1>
    <div class="note">
      Accommodation booking transactions are no longer handled inside this system.
      Please use the Tourism Office monthly reporting workflow instead.
    </div>
    <div class="actions">
      <a class="primary" href="{% url 'admin_app:owner_report_submit' %}">Open Monthly Reports</a>
      <a class="secondary" href="{% url 'admin_app:owner_hub' %}">Back to Owner Hub</a>
    </div>
  </div>
</body>
</html>
